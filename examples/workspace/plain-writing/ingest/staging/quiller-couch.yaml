- slug: clear-prose
  type: topic
  name: Clear prose
  evidence: practitioner
  freshness: evergreen
  summary: Practical clarity is a teachable aim, bounded by purpose and genre.
  points:
  - text: Quiller-Couch locates a harder prose task in expressing thought beyond straightforward narrative.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 149
  quotes:
  - text: It is when prose attempts to philosophise, to express thoughts as well as to relate simple sayings and
      doings—it is then that the trouble begins.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 149
- slug: diction-and-register
  type: topic
  name: Diction and register
  evidence: practitioner
  freshness: evergreen
  summary: Word choice must fit meaning, audience and occasion.
  points:
  - text: Quiller-Couch warns that literature cannot be classified as though it were a science.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 144
  - text: Quiller-Couch says living artistic practice can defeat a neat formula.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 146
  quotes:
  - text: In studying literature, and still more in studying to write it, distrust all classification !
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 144
  - text: genius uses our best-laid logic to explode it.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 146
- slug: economy-without-compression
  type: principle
  name: Economy without compression
  evidence: practitioner
  freshness: evergreen
  summary: Concision removes wasted work while retaining necessary detail.
  points:
  - text: Quiller-Couch values a high moment in which thought and emotion work together.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 150
  - text: Quiller-Couch refuses to set a fixed boundary to prose’s range of thought or music.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 168
  quotes:
  - text: there you have emotion im-pregnated with thought.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 150
  - text: Or who shall determine its range, whether of thought or of music?
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 168
