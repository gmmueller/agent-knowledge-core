- slug: clear-prose
  type: topic
  name: Clear prose
  evidence: practitioner
  freshness: evergreen
  summary: Practical clarity is a teachable aim, bounded by purpose and genre.
  points:
  - text: Quiller-Couch wants literary study to include active writing practice.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 42
  - text: Quiller-Couch identifies accuracy, perspicuity, persuasion and appropriateness as his chosen aims.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 52
  quotes:
  - text: a part—and no small part—of our business is to practise it.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 42
  - text: since the first aim of speech is to be under-stood.
    speaker: Arthur Quiller-Couch
    cite:
      raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
      at: p. 52
