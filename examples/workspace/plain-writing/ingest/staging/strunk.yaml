- slug: historical-usage
  type: topic
  name: Historical usage
  evidence: practitioner
  freshness: dated
  summary: The sources record early twentieth-century conventions rather than current universal standards.
  points:
  - text: Strunk lists exceptions for certain ancient names and conventional possessive expressions.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶8
  quotes:
  - text: Exceptions are the possessives of ancient proper names in -es and -is, the possessive Jesus' , and such
      forms as for conscience' sake, for righteousness' sake.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶8
- slug: punctuation-and-attachment
  type: topic
  name: Punctuation and attachment
  evidence: practitioner
  freshness: evergreen
  summary: Punctuation and word order express grammatical relationships.
  points:
  - text: Strunk applies singular possessive apostrophe-s regardless of the final consonant, subject to his named
      exceptions.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶3
  - text: Strunk gives pronominal possessives without an apostrophe.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶12
  - text: Strunk uses a comma after each term except the last in a series with one conjunction.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶13
  - text: Strunk permits omission for a slight parenthetic interruption but rejects retaining just one of the pair
      of commas.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶24
  - text: Strunk sets off non-restrictive relative clauses with commas.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶29
  - text: Strunk gives restrictive relative clauses without surrounding commas.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶38
  quotes:
  - text: Follow this rule whatever the final consonant.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶3
  - text: The pronominal possessives hers, its, theirs, yours, and oneself have no apostrophe.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶12
  - text: '2.'
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶13
  - text: This rule is difficult to apply; it is frequently hard to decide whether a single word, such as however,
      or a brief phrase, is or is not parenthetic.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶24
  - text: Non-restrictive relative clauses are, in accordance with this rule, set off by commas.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶29
  - text: Restrictive relative clauses are not set off by commas.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶38
- slug: sentence-emphasis
  type: topic
  name: Sentence emphasis
  evidence: practitioner
  freshness: evergreen
  summary: Order and deliberate variation distribute a sentence’s emphasis.
  points:
  - text: Strunk allows occasional loose sentences to give relief from uniformly compact and periodic prose.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶54
  quotes:
  - text: But a writer may err by making his sentences too uniformly compact and periodic, and an occasional loose
      sentence prevents the style from becoming too formal and gives the reader a certain relief.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶54
- slug: historical-usage
  type: topic
  name: Historical usage
  evidence: practitioner
  freshness: dated
  summary: The sources record early twentieth-century conventions rather than current universal standards.
  points:
  - text: Strunk gives principles rather than a universal formula for dividing words at line ends.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶101
  quotes:
  - text: If there is room at the end of a line for one or more syllables of a word, but not for the whole word,
      divide the word, unless this involves cutting off only a single
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶101
- slug: punctuation-and-attachment
  type: topic
  name: Punctuation and attachment
  evidence: practitioner
  freshness: evergreen
  summary: Punctuation and word order express grammatical relationships.
  points:
  - text: Strunk joins independent clauses without a conjunction by a semicolon.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶60
  - text: Strunk also permits separate sentences instead of a semicolon.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶63
  - text: Strunk distinguishes a joining adverb from a conjunction when selecting punctuation.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶69
  - text: Strunk allows a comma between very short clauses alike in form.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶73
  - text: Strunk repairs accidental sentence fragments by replacing an inappropriate period with a comma.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶80
  - text: Strunk requires the reader to attach an introductory participle to the intended subject.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶87
  quotes:
  - text: If two or more clauses, grammatically complete and not joined by a conjunction, are to form a single compound
      sentence, the proper mark of punctuation is a semicolon.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶60
  - text: It is of course equally correct to write the above as two sentences each, replacing the semicolons by
      periods.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶63
  - text: Note that if the second clause is preceded by an adverb, such as accordingly, besides, so, then, therefore,
      or thus, and not by a conjunction, the semicolon is still required.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶69
  - text: 'If the clauses are very short, and are alike in form, a comma is usually permissible:'
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶73
  - text: In both these examples, the first period should be replaced by a comma, and the following word begun with
      a small letter.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶80
  - text: The word walking refers to the subject of the sentence, not to the woman.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶87
- slug: rule-keep-related-words-together
  type: rule
  name: Keep related words together
  evidence: practitioner
  freshness: evergreen
  summary: Place related sentence elements near one another so their connection is clear.
  status: bench
  points:
  - text: Strunk requires the reader to attach an introductory participle to the intended subject.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶87
  quotes:
  - text: The word walking refers to the subject of the sentence, not to the woman.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶87
- slug: sentence-emphasis
  type: topic
  name: Sentence emphasis
  evidence: practitioner
  freshness: evergreen
  summary: Order and deliberate variation distribute a sentence’s emphasis.
  points:
  - text: Strunk permits a detached word or expression when it earns the emphatic sentence treatment.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶81
  quotes:
  - text: 'It is permissible to make an emphatic word or expression serve the purpose of a sentence and to punctuate
      it accordingly:'
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
      at: ¶81
- slug: diction-and-register
  type: topic
  name: Diction and register
  evidence: practitioner
  freshness: evergreen
  summary: Word choice must fit meaning, audience and occasion.
  points:
  - text: Strunk recognizes narrative paragraphs whose rhetorical pause replaces a topic-sentence structure.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶74
  quotes:
  - text: The brief paragraphs of animated narrative, however, are often without even this semblance of a topic
      sentence.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶74
- slug: paragraph-plan
  type: method
  name: Plan a paragraph
  evidence: practitioner
  freshness: evergreen
  summary: Develop and finish the thought announced by a paragraph.
  points:
  - text: Strunk varies the extent of subdivision with the length of the composition.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶5
  - text: Strunk’s opening-topic practice is meant to help readers recognize and retain a paragraph’s purpose.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶30
  - text: Strunk warns against ending a paragraph on a digression or unimportant detail.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶34
  quotes:
  - text: The extent of subdivision will vary with the length of the composition.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶5
  - text: Again, the object is to aid the reader.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶30
  - text: Ending with a digression, or with an unimportant detail, is particularly to be avoided.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶34
- slug: paragraph-unity
  type: topic
  name: Paragraph unity
  evidence: practitioner
  freshness: evergreen
  summary: Paragraphs expose the steps of a thought to the reader.
  points:
  - text: Strunk allows a slight subject to occupy one paragraph and recommends checking whether subdivision helps.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶3
  - text: Strunk makes a new paragraph signal a new step in the subject’s development.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶4
  - text: Strunk normally discourages single-sentence paragraphs but excepts useful transitions.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶27
  - text: Strunk starts a new paragraph at each change of speaker in dialogue.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶28
  - text: Strunk recognizes narrative paragraphs whose rhetorical pause replaces a topic-sentence structure.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶74
  quotes:
  - text: If the subject on which you are writing is of slight extent, or if you intend to treat it very briefly,
      there may be no need of subdividing it into topics.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶3
  - text: Ordinarily, however, a subject requires subdivision into topics, each of which should be made the subject
      of a paragraph.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶4
  - text: As a rule, single sentences should not be written or printed as paragraphs.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶27
  - text: In dialogue, each speech, even if only a single word, is a paragraph by itself; that is, a new paragraph
      begins with each change of speaker.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶28
  - text: The brief paragraphs of animated narrative, however, are often without even this semblance of a topic
      sentence.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶74
