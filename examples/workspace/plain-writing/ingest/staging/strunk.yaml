concepts:
- slug: clear-prose
  type: topic
  name: Clear prose
  evidence: practitioner
  freshness: evergreen
  summary: Practical clarity is a teachable aim, bounded by purpose and genre.
  points:
  - text: Strunk intends the book for courses combining composition practice with literary study.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶2
  - text: Strunk concentrates on the principal requirements of plain English style.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶2
  - text: Strunk explicitly limits the book to a small portion of English style.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶3
  - text: Strunk recommends learning everyday plain English before studying literary masters for the secrets of
      style.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶16
  quotes:
  - text: This book is intended for use in English courses in which the practice of composition is combined with
      the study of literature.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶2
  - text: This book is intended for use in English courses in which the practice of composition is combined with
      the study of literature.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶2
  - text: The book covers only a small portion of the field of English style, but the experience of its writer has
      been that once past the essentials, students profit most by individual instruction based on the
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶3
  - text: It is an old observation that the best writers sometimes disregard the rules of rhetoric.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
      at: ¶16
