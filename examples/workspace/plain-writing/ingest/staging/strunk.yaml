    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶23
  quotes:
  - text: (Many of the words and expressions here listed are not so much bad English as bad style, the commonplaces
