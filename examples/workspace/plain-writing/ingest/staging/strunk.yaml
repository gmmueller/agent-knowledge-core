      at: ¶30
- slug: clear-prose
  type: topic
  name: Clear prose
  evidence: practitioner
  freshness: evergreen
  summary: Practical clarity is a teachable aim, bounded by purpose and genre.
  points:
  - text: Strunk asks for definite assertions and reserves not for denial or antithesis rather than evasion.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶111
  quotes:
  - text: Make definite assertions.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶111
- slug: jargon-audit
  type: method
  name: Audit jargon
  evidence: practitioner
  freshness: evergreen
  summary: Look for circumlocution and empty abstraction, then express the actual thought.
  points:
  - text: Strunk criticizes nominalized actions whose verbs merely complete the sentence.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶102
  quotes:
  - text: A common fault is to use as the subject of a passive construction a noun which expresses the entire action,
      leaving to the verb no function beyond that of completing the sentence.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶102
- slug: revision-pass
  type: method
  name: A revision pass
  evidence: practitioner
  freshness: evergreen
  summary: Review meaning, structure and expression in a deliberate sequence.
  points:
  - text: Strunk warns that rewriting an indefinite statement can require guessing the writer’s intention.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶118
  quotes:
  - text: The last example, before correction, is indefinite as well as negative.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶118
- slug: rule-prefer-active-voice
  type: rule
  name: Prefer the active voice when it suits the subject
  evidence: practitioner
  freshness: evergreen
  summary: Use the active voice as a useful default while preserving justified passive constructions.
  status: bench
  points:
  - text: Strunk describes active voice as usually more direct and vigorous.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶76
  - text: Strunk explicitly says his active-voice advice does not discard passives.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶83
  - text: Strunk uses transitive active verbs to strengthen tame description and exposition.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶87
  quotes:
  - text: 'The active voice is usually more direct and vigorous than the passive:'
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶76
  - text: This rule does not, of course, mean that the writer should entirely discard the passive voice, which is
      frequently convenient and sometimes necessary.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶83
  - text: The habitual use of the active voice, however, makes for forcible writing.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶87
- slug: voice-and-agency
  type: topic
  name: Voice and agency
  evidence: practitioner
  freshness: evergreen
  summary: Voice choices determine which participant the sentence treats as its subject.
  points:
  - text: Strunk describes active voice as usually more direct and vigorous.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶76
  - text: Strunk warns that deleting the agent from a passive can make the intended actor indefinite.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶82
  - text: Strunk explicitly says his active-voice advice does not discard passives.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶83
  - text: Strunk lets the subject needed by the paragraph determine the voice.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶86
  quotes:
  - text: 'The active voice is usually more direct and vigorous than the passive:'
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶76
  - text: 'it becomes indefinite: is it the writer, or some person undisclosed, or the world at large, that will
      always remember this visit?'
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶82
  - text: This rule does not, of course, mean that the writer should entirely discard the passive voice, which is
      frequently convenient and sometimes necessary.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶83
  - text: The first would be the right form in a paragraph on the dramatists of the Restoration; the second, in
      a paragraph on the tastes of modern readers.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶86
- slug: economy-without-compression
  type: principle
  name: Economy without compression
  evidence: practitioner
  freshness: evergreen
  summary: Concision removes wasted work while retaining necessary detail.
  points:
  - text: Strunk treats unnecessary words and sentences as wasted parts of a composition.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: Strunk’s concision rule does not require every sentence to be short.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: Strunk preserves detail when every word contributes.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: Strunk connects active voice and positive statement with concision.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶171
  quotes:
  - text: Vigorous writing is concise.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: Vigorous writing is concise.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: Vigorous writing is concise.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: As positive statement is more concise than negative, and the active voice more concise than the passive,
      many of the examples given under Rules 11 and 12 illustrate this rule as well.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶171
- slug: jargon-audit
  type: method
  name: Audit jargon
  evidence: practitioner
  freshness: evergreen
  summary: Look for circumlocution and empty abstraction, then express the actual thought.
  points:
  - text: Strunk targets the fact that as a repeatedly removable phrase.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶152
  - text: Strunk directs readers to his discussions of case, character, nature and system for related padding.
