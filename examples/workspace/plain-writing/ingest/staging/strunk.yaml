- slug: revision-pass
  type: method
  name: A revision pass
  evidence: practitioner
  freshness: evergreen
  summary: Review meaning, structure and expression in a deliberate sequence.
  points:
  - text: Strunk sometimes combines step-by-step sentences to express one complex idea more efficiently.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶172
  quotes:
  - text: A common violation of conciseness is the presentation of a single complex idea, step by step, in a series
      of sentences which might to advantage be combined into one.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶172
- slug: rule-omit-needless-words
  type: rule
  name: Omit needless words
  evidence: practitioner
  freshness: evergreen
  summary: Keep the detail that earns its place and remove empty verbal padding.
  status: bench
  points:
  - text: Strunk treats unnecessary words and sentences as wasted parts of a composition.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: Strunk targets the fact that as a repeatedly removable phrase.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶152
  - text: Strunk notes that who is and which was are often superfluous.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶166
  quotes:
  - text: Vigorous writing is concise.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶136
  - text: In especial the expression the fact that should be revised out of every sentence in which it occurs.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶152
  - text: Who is, which was, and the like are often superfluous.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶166
- slug: parallelism
  type: glossary
  name: Parallelism
  evidence: practitioner
  freshness: evergreen
  summary: Similar grammatical form makes related content easier to recognize.
  points:
  - text: Strunk uses parallel form to make a likeness of content and function recognizable.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶182
  - text: Strunk gives matching grammatical constructions after correlative expressions.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶192
  - text: Strunk applies an article or preposition consistently across a series.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶187
  - text: Strunk suggests grouping a large set of co-ordinate ideas or using a table.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶202
  quotes:
  - text: This principle, that of parallel construction, requires that expressions of similar content and function
      should be outwardly similar.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶182
  - text: Correlative expressions (both, and; not, but; not only, but also; either, or; first, second, third; and
      the like) should be followed by the same grammatical construction.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶192
  - text: an article or a preposition applying to all the members of a series must either be used only before the
      first term or else be repeated before each term.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶187
  - text: Otherwise he had best avoid the difficulty by putting his statements in the form of a table.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶202
- slug: revision-pass
  type: method
  name: A revision pass
  evidence: practitioner
  freshness: evergreen
  summary: Review meaning, structure and expression in a deliberate sequence.
  points:
  - text: Strunk chooses varied structures to represent the actual relations of the thought.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶180
  quotes:
  - text: If the writer finds that he has written a series of sentences of the type described, he should recast
      enough of them to remove the monotony, replacing them by simple sentences, by sentences of two
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶180
- slug: rule-keep-related-words-together
  type: rule
  name: Keep related words together
  evidence: practitioner
  freshness: evergreen
  summary: Place related sentence elements near one another so their connection is clear.
  status: bench
  points:
  - text: Strunk makes word position the principal signal of relationships inside a sentence.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶204
  - text: Strunk allows interruptions that deliberately create suspense rather than applying proximity mechanically.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶210
  - text: Strunk puts modifiers near the expressions they modify to prevent a false relationship.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶227
  quotes:
  - text: The position of the words in a sentence is the principal means of showing their relationship.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶204
  - text: The objection is that the interposed phrase or clause needlessly interrupts the natural order of the main
      clause.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶210
  - text: Modifiers should come, if possible next to the word they modify.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶227
