- slug: sentence-emphasis
  type: topic
  name: Sentence emphasis
  evidence: practitioner
  freshness: evergreen
  summary: Order and deliberate variation distribute a sentence’s emphasis.
  points:
  - text: Strunk objects to a succession of similar loose sentences because the pattern becomes monotonous.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶176
  - text: Strunk chooses varied structures to represent the actual relations of the thought.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶180
  - text: Strunk generally gives the sentence’s prominent end position to its new element.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶248
  quotes:
  - text: This rule refers especially to loose sentences of a particular type, those consisting of two co-ordinate
      clauses, the second introduced by a conjunction or relative.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶176
  - text: If the writer finds that he has written a series of sentences of the type described, he should recast
      enough of them to remove the monotony, replacing them by simple sentences, by sentences of two
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶180
  - text: The word or group of words entitled to this position of prominence is usually the logical predicate, that
      is, the new element in the sentence, as it is in the second example.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
      at: ¶248
- slug: diction-and-register
  type: topic
  name: Diction and register
  evidence: practitioner
  freshness: evergreen
  summary: Word choice must fit meaning, audience and occasion.
  points:
  - text: Strunk recognizes that periodicals can have different title conventions from scholarly usage.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶39
  quotes:
  - text: For the titles of literary works, scholarly usage prefers italics with capitalized initials.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶39
- slug: historical-usage
  type: topic
  name: Historical usage
  evidence: practitioner
  freshness: dated
  summary: The sources record early twentieth-century conventions rather than current universal standards.
  points:
  - text: Strunk leaves space after a manuscript heading.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶3
  - text: Strunk writes dates and serial numbers in figures or suitable Roman notation.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶5
  - text: Strunk recognizes that periodicals can have different title conventions from scholarly usage.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶39
  quotes:
  - text: Leave a blank line, or its equivalent in space, after the title or heading of a manuscript.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶3
  - text: Do not spell out dates or other serial numbers.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶5
  - text: For the titles of literary works, scholarly usage prefers italics with capitalized initials.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶39
- slug: punctuation-and-attachment
  type: topic
  name: Punctuation and attachment
  evidence: practitioner
  freshness: evergreen
  summary: Punctuation and word order express grammatical relationships.
  points:
  - text: Strunk punctuates the sentence outside a parenthesis as if its contents were absent.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶11
  - text: Strunk puts a detached parenthetical sentence’s final stop inside the closing mark.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶14
  - text: Strunk introduces formal documentary quotations with a colon.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶16
  - text: Strunk precedes appositive or direct-object quotations with a comma.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶18
  - text: Strunk treats quotations introduced by that as indirect discourse without quotation marks.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶25
  quotes:
  - text: A sentence containing an expression in parenthesis is punctuated, outside of the marks of parenthesis,
      exactly as if the expression in parenthesis were absent.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶11
  - text: (When a wholly detached expression or sentence is parenthesized, the final stop comes before the last
      mark of parenthesis.)
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶14
  - text: Formal quotations, cited as documentary evidence, are introduced by a colon and enclosed in quotation
      marks.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶16
  - text: Quotations grammatically in apposition or the direct objects of verbs are preceded by a comma and enclosed
      in quotation marks.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶18
  - text: Quotations introduced by that are regarded as in indirect discourse and not enclosed in quotation marks.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
      at: ¶25
- slug: circumlocution
  type: glossary
