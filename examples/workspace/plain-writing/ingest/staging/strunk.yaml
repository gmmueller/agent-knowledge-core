- slug: diction-and-register
  type: topic
  name: Diction and register
  evidence: practitioner
  freshness: evergreen
  summary: Word choice must fit meaning, audience and occasion.
  points:
  - text: Strunk treats indiscriminate certainly as a mannerism.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶21
  - text: Strunk distinguishes laying claim from declaring, maintaining or charging.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶27
  quotes:
  - text: Used indiscriminately by some speakers, much as others use very, to intensify any and every statement.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶21
  - text: With object-noun, means lay claim to.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶27
- slug: historical-usage
  type: topic
  name: Historical usage
  evidence: practitioner
  freshness: dated
  summary: The sources record early twentieth-century conventions rather than current universal standards.
  points:
  - text: Strunk spells all right as two words in the uses he discusses.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶4
  - text: Strunk distinguishes compare to for resemblance from compare with for difference.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶29
  quotes:
  - text: Idiomatic in familiar speech as a detached phrase in the sense, "Agreed," or "Go ahead." In other uses
      better avoided.
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶4
  - text: To compare to is to point out or imply resemblances, between objects regarded as essentially of different
      order; to compare with is mainly to point out differences, between objects regarded as essentially of the
      same
    speaker: William Strunk Jr.
    cite:
      raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
      at: ¶29
