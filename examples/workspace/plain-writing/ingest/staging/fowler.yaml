- slug: jargon-audit
  type: method
  name: Audit jargon
  evidence: practitioner
  freshness: evergreen
  summary: Look for circumlocution and empty abstraction, then express the actual thought.
  points:
  - text: The Fowlers say heavily abstract sentences often need restructuring rather than word substitution.
