- slug: clear-prose
  type: topic
  name: Clear prose
  evidence: practitioner
  freshness: evergreen
  summary: Practical clarity is a teachable aim, bounded by purpose and genre.
  points:
  - text: The Fowlers put directness, simplicity, brevity, vigour and lucidity before showiness.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶4
  quotes:
  - text: Any one who wishes to become a good writer should endeavour, before he allows himself to be tempted by
      the more showy qualities, to be direct, simple, brief, vigorous, and lucid.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶4
