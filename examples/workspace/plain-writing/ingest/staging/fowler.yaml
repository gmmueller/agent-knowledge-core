- slug: meaning-before-etymology
  type: principle
  name: Meaning before etymology
  evidence: practitioner
  freshness: evergreen
  summary: Reader understanding takes priority over the ancestry of a word.
  points:
  - text: The Fowlers rank the Saxon preference last and reject substituting an unfamiliar native word for familiar
      English.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶7
  quotes:
  - text: These rules are given roughly in order of merit; the last is also the least.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶7
- slug: reader-attention
  type: principle
  name: Reader attention
  evidence: practitioner
  freshness: evergreen
  summary: The writer’s choices should reduce the reader’s avoidable interpretive work.
  points:
  - text: The Fowlers select words the probable reader understands without wasted time or thought.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶9
  quotes:
