- slug: diction-and-register
  type: topic
  name: Diction and register
  evidence: practitioner
  freshness: evergreen
  summary: Word choice must fit meaning, audience and occasion.
  points:
  - text: The Fowlers regard new words as a sign of living language while calling for scrutiny of each newcomer.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶50
  - text: The Fowlers recognize new scientific things require new names.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶51
  - text: The Fowlers distinguish nonce-word motives such as precision from avoidance of the obvious.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶52
  - text: The Fowlers allow a foreign expression when it offers the shortest or clearest meaning, or a special association.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶99
  - text: The Fowlers allow slang in conversation and characterization while limiting it in a narrator’s prose.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶259
  quotes:
  - text: Most people of literary taste will say on this point 'It must needs be that offences come; but woe to
      that man by whom the offence cometh'.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶50
  - text: The progress of arts and sciences gives occasion for the large majority of new words; for a new thing
      we must have a new name; hence, for instance, motor, argon, appendicitis.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶51
  - text: Among other arts and sciences, that of lexicography happens to have found convenient a neologism that
      may here be used to help in the very slight classification required for the new words we are more
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶52
  - text: The usual protest must be made, to be treated no doubt with the usual disregard.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶99
  - text: The place of slang is in real life.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶259
- slug: historical-usage
  type: topic
  name: Historical usage
  evidence: practitioner
  freshness: dated
  summary: The sources record early twentieth-century conventions rather than current universal standards.
  points:
  - text: The Fowlers treat Americanisms as foreign to their British editorial norm, even while praising fall on
      its merits.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶82
  - text: The Fowlers advocate keeping English and American literary usage apart in their historical setting.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶87
  quotes:
  - text: Though we take these separately from foreign words, which will follow next, the distinction is purely
      pro forma; Americanisms are foreign words, and should be so treated.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶82
  - text: The words are, as we said, extremely efficient; but the impulse that selects them is in harmony with American,
      not with English, methods, and we hope it may be developed in America rather than here.
    speaker: H. W. Fowler and F. G. Fowler
    cite:
      raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
      at: ¶87
