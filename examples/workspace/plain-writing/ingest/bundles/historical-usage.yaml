  at: p. 145
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Exceptions are the possessives of ancient proper names in -es and -is, the possessive Jesus' , and such forms as for
    conscience' sake, for righteousness' sake.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
  at: ¶8
  item: strunk/web-the-elements-of-style-rules-wikisource-the-free-online-libra
  batch: strunk
- text: If there is room at the end of a line for one or more syllables of a word, but not for the whole word, divide the
    word, unless this involves cutting off only a single
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-rules-wikisource-the-free-online-libra
  at: ¶101
  item: strunk/web-the-elements-of-style-rules-wikisource-the-free-online-libra
  batch: strunk
- text: Leave a blank line, or its equivalent in space, after the title or heading of a manuscript.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
  at: ¶3
  item: strunk/web-the-elements-of-style-form-wikisource-the-free-online-librar
  batch: strunk
