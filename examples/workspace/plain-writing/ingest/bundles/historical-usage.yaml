quotes:
- text: Though we take these separately from foreign words, which will follow next, the distinction is purely pro forma; Americanisms
    are foreign words, and should be so treated.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶82
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The words are, as we said, extremely efficient; but the impulse that selects them is in harmony with American, not
    with English, methods, and we hope it may be developed in America rather than here.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶87
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: It is, in fact, a bar-barism, and a mongrel at that.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 58
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: such terms at best cannot be scientific, precise, determinate,
  speaker: Arthur Quiller-Couch
