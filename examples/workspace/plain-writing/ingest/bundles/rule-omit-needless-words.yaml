quotes:
- text: Prefer the familiar word to the far-fetched.Prefer the concrete word to the abstract.Prefer the single word to the
    circumlocution.Prefer the short word to the long.Prefer the Saxon word to the Romance.[1]
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶6
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The first is that it uses circumlocution rather than short straight speech.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 121
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: They are all dodges of jargon, circumlocutions for evad-ing this or that simple statement;
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 130
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: the second clause but repeats the first without adding one jot.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 131
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Murder your darlings.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 297
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Vigorous writing is concise.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
  at: ¶136
  item: strunk/web-the-elements-of-style-principles-wikisource-the-free-online
  batch: strunk
- text: In especial the expression the fact that should be revised out of every sentence in which it occurs.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
  at: ¶152
  item: strunk/web-the-elements-of-style-principles-wikisource-the-free-online
  batch: strunk
- text: Who is, which was, and the like are often superfluous.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
  at: ¶166
  item: strunk/web-the-elements-of-style-principles-wikisource-the-free-online
  batch: strunk
- text: Whether is sufficient; see under Rule 13.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
  at: ¶10
  item: strunk/web-the-elements-of-style-misuse-wikisource-the-free-online-libr
  batch: strunk
- text: Often simply redundant, used from a mere habit of wordiness.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
  at: ¶23
