points:
- text: The Fowlers prefer concrete to abstract words.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶6
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: Quiller-Couch identifies vague abstract nouns as jargon’s other central vice.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 121
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch recommends the active verb and concrete noun against padded recipient constructions.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 133
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch connects concrete words with thinking about the things themselves.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 142
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Strunk distinguishes bad style from bad English and calls for definite statement in place of vague generality.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
  at: ¶2
  item: strunk/web-the-elements-of-style-misuse-wikisource-the-free-online-libr
  batch: strunk
quotes:
- text: Prefer the familiar word to the far-fetched.Prefer the concrete word to the abstract.Prefer the single word to the
    circumlocution.Prefer the short word to the long.Prefer the Saxon word to the Romance.[1]
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶6
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The first is that it uses circumlocution rather than short straight speech.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 121
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: The first virtue, the touchstone of masculine style, is its use of the active verb and the concrete noun.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 133
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: concrete ones which lie as near as can be reached to things themselves
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 142
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: (Many of the words and expressions here listed are not so much bad English as bad style, the commonplaces of careless
    writing.
