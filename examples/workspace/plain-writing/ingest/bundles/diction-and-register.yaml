quotes:
- text: Prefer the familiar word to the far-fetched.Prefer the concrete word to the abstract.Prefer the single word to the
    circumlocution.Prefer the short word to the long.Prefer the Saxon word to the Romance.[1]
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶6
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: By way of general rules for the choice of words, so much must suffice.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶47
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: Most people of literary taste will say on this point 'It must needs be that offences come; but woe to that man by
    whom the offence cometh'.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶50
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The progress of arts and sciences gives occasion for the large majority of new words; for a new thing we must have
    a new name; hence, for instance, motor, argon, appendicitis.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶51
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: Among other arts and sciences, that of lexicography happens to have found convenient a neologism that may here be
    used to help in the very slight classification required for the new words we are more
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶52
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The usual protest must be made, to be treated no doubt with the usual disregard.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶99
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The place of slang is in real life.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶259
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: whenyou talk or write, youwould wish to observe the occasion;
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 49
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: this desire of yours to be appropriate is really the root of the matter.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 50
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: I expect, nay exact, that Byron shall be mentioned again and again.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 129
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: In studying literature, and still more in studying to write it, distrust all classification !
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 144
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: genius uses our best-laid logic to explode it.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 146
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Literature, being by its nature personal, must be by its nature almost infinitely various.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 299
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: so much must ever depend on who speaks, and to whom, in what mood and upon what occa-sion;
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 302
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: rejecting no coin for its minting but only if its metal be base.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 305
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: It is an old observation that the best writers sometimes disregard the rules of rhetoric.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
  at: ¶16
  item: strunk/web-the-elements-of-style-introduction-wikisource-the-free-onlin
  batch: strunk
