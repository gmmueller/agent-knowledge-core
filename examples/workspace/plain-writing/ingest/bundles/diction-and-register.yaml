points:
- text: The Fowlers prefer familiar to far-fetched vocabulary.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶6
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The Fowlers preserve important shades of meaning and register, and warn against monotonous application of the preferences.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶47
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The Fowlers regard new words as a sign of living language while calling for scrutiny of each newcomer.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶50
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The Fowlers recognize new scientific things require new names.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶51
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The Fowlers distinguish nonce-word motives such as precision from avoidance of the obvious.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶52
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The Fowlers allow a foreign expression when it offers the shortest or clearest meaning, or a special association.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶99
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: The Fowlers allow slang in conversation and characterization while limiting it in a narrator’s prose.
  speaker: H. W. Fowler and F. G. Fowler
  raw: library/fowler/raw/web/00000000-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli-recapture-20261120
  at: ¶259
  item: fowler/web-the-king-s-english-part-1-chapter-1-wikisource-the-free-onli
  batch: fowler
- text: Quiller-Couch asks writers to observe the occasion and avoid ill-timed excess.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 49
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch makes appropriateness fundamental to his teaching.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 50
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch rejects timid variation that keeps replacing a person’s name with elaborate descriptions.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 129
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch warns that literature cannot be classified as though it were a science.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 144
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch says living artistic practice can defeat a neat formula.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 146
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch sees literature as personal and therefore various.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 299
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch justifies slang and new words by speaker, audience, mood and occasion.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 302
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Quiller-Couch encourages a wide vocabulary and distinguishes good material from the origin of its coinage.
  speaker: Arthur Quiller-Couch
  raw: library/quiller-couch/raw/book/on-the-art-of-writing-selected
  at: p. 305
  item: quiller-couch/book-on-the-art-of-writing-selected
  batch: quiller-couch
- text: Strunk allows that strong writers break rhetorical rules to gain a compensating merit.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-introduction-wikisource-the-free-onlin
  at: ¶16
  item: strunk/web-the-elements-of-style-introduction-wikisource-the-free-onlin
  batch: strunk
- text: Strunk recognizes narrative paragraphs whose rhetorical pause replaces a topic-sentence structure.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-principles-wikisource-the-free-online
  at: ¶74
  item: strunk/web-the-elements-of-style-principles-wikisource-the-free-online
  batch: strunk
- text: Strunk recognizes that periodicals can have different title conventions from scholarly usage.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-form-wikisource-the-free-online-librar
  at: ¶39
  item: strunk/web-the-elements-of-style-form-wikisource-the-free-online-librar
  batch: strunk
- text: Strunk treats indiscriminate certainly as a mannerism.
  speaker: William Strunk Jr.
  raw: library/strunk/raw/web/00000000-the-elements-of-style-misuse-wikisource-the-free-online-libr
  at: ¶21
  item: strunk/web-the-elements-of-style-misuse-wikisource-the-free-online-libr
  batch: strunk
